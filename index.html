<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Bytes</title>
    <meta name="description" content="Tech Bytes: tech, AI, gaming and security news in a retro Game Boy style. No ads. No noise. Just tech.">
    <meta name="theme-color" content="#8CA17C">

    <!-- Share preview (WhatsApp, X, Telegram, LinkedIn...) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tech Bytes">
    <meta property="og:description" content="Tech, AI, gaming and security news in a retro Game Boy style. No ads. No noise. Just tech.">
    <meta property="og:url" content="https://tech-byte-news.netlify.app/">
    <meta property="og:image" content="https://tech-byte-news.netlify.app/android-chrome-512x512.png">
    <meta name="twitter:card" content="summary">

    <!-- Remember night mode before the page draws (no flash) -->
    <script>
        try {
            if (localStorage.getItem('techbytes.theme') === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tech bytes.css">
    <link rel="stylesheet" href="tailwind.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body class="flex flex-col min-h-screen">
    <nav class="site-header p-4 pixel-border">
        <div class="container mx-auto flex justify-between items-center">
            <a href="#" onclick="showAllNews(); return false;" class="text-2xl pixel-font rounded-none px-2 py-1">TECH BYTES</a>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to night mode"></button>
        </div>
    </nav>

    <main class="flex-grow container mx-auto p-6 md:p-8">
        <section class="mb-12">
            <h2 class="text-3xl md:text-4xl pixel-font text-center mb-8">
                LATEST NEWS
            </h2>
            <p class="tagline blink">NO ADS. NO NOISE. JUST TECH.</p>
            <div id="filter-bar" class="filter-bar" hidden></div>
            <div id="search-bar" class="search-bar" hidden>
                <label class="search-field" for="search-input">
                    <span class="search-prompt" aria-hidden="true">&gt;</span>
                    <input id="search-input" class="search-input" type="text" placeholder="Search stories..." autocomplete="off" spellcheck="false" maxlength="60">
                    <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>X</button>
                </label>
                <p id="search-status" class="search-status" aria-live="polite"></p>
            </div>
            <noscript>
                <div class="pixel-card"><p class="pixel-font">Tech Bytes needs JavaScript to load the news.</p></div>
            </noscript>
            <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="pixel-card flex justify-center items-center h-48">
                    <p class="pixel-font text-lg animate-pulse">Loading news...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer p-6 pixel-border mt-auto">
        <div class="container mx-auto text-center md:flex md:justify-between md:items-center">
